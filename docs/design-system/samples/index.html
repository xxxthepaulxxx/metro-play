<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>捷運冒險家 Metro Adventurer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #0070BD;
    --green: #00A86B;
    --gold: #FFB300;
    --gold-dark: #FF8C00;
    --purple: #7C3AED;
    --purple-dark: #4F46E5;
    --white15: rgba(255,255,255,0.15);
    --white30: rgba(255,255,255,0.3);
    --white80: rgba(255,255,255,0.85);
    --card-blur: blur(12px);
    --radius: 16px;
  }

  html, body {
    min-height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0070BD 0%, #008DA0 40%, #00A86B 100%) fixed;
    background-attachment: fixed;
    color: #fff;
    overflow-x: hidden;
  }

  /* Floating particle canvas */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    bottom: -20px;
    font-size: 14px;
    opacity: 0;
    animation: floatUp 6s ease-in infinite;
  }
  .particle:nth-child(1) { left: 10%; animation-delay: 0s; font-size: 12px; }
  .particle:nth-child(2) { left: 55%; animation-delay: 2s; font-size: 16px; }
  .particle:nth-child(3) { left: 80%; animation-delay: 4s; font-size: 10px; }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Wrapper */
  .app {
    position: relative;
    z-index: 1;
    max-width: 375px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── TAB BAR ─── */
  .tab-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 2px 8px;
    font-size: 10px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    position: relative;
    gap: 2px;
    transition: color 0.2s;
    user-select: none;
  }

  .tab .tab-icon { font-size: 16px; line-height: 1; }
  .tab .tab-label { line-height: 1.2; text-align: center; white-space: nowrap; }

  .tab.active {
    color: var(--gold);
  }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 15%; right: 15%;
    height: 2.5px;
    background: var(--gold);
    border-radius: 2px 2px 0 0;
    box-shadow: 0 0 8px var(--gold);
  }

  /* ─── SCROLL AREA ─── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 14px 32px;
    -webkit-overflow-scrolling: touch;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* ─── HERO HEADER ─── */
  .hero {
    padding: 22px 4px 16px;
    text-align: center;
  }
  .hero-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    margin-bottom: 14px;
  }
  .hero-player {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .avatar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .avatar-emoji { font-size: 28px; line-height: 1; }
  .level-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1.5px solid var(--gold);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    background: rgba(255,179,0,0.12);
    box-shadow: 0 0 8px rgba(255,179,0,0.3);
    letter-spacing: 0.3px;
  }
  .pts-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,179,0,0.18);
    border: 1.5px solid var(--gold);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 800;
    color: var(--gold);
    box-shadow: 0 0 10px rgba(255,179,0,0.25);
  }

  /* ─── GLASS CARD ─── */
  .card {
    background: var(--white15);
    backdrop-filter: var(--card-blur);
    -webkit-backdrop-filter: var(--card-blur);
    border: 1px solid var(--white30);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    color: #fff;
  }

  /* ─── TODAY'S MISSION CARD ─── */
  .briefing-header {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .briefing-line {
    font-size: 13px;
    line-height: 1.6;
    color: rgba(255,255,255,0.9);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 4px;
  }
  .briefing-line:last-child { margin-bottom: 0; }
  .alert-line { color: #FFD580; }

  /* ─── MISSION CARDS ─── */
  .mission-badge {
    display: inline-block;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .badge-gold {
    background: rgba(255,179,0,0.25);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .badge-purple {
    background: rgba(124,58,237,0.3);
    border: 1px solid #A78BFA;
    color: #DDD6FE;
  }

  .mission-title {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 4px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.2);
  }
  .mission-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .mission-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .reward-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 800;
  }
  .reward-gold {
    background: rgba(255,179,0,0.2);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .reward-purple {
    background: rgba(124,58,237,0.2);
    border: 1px solid #A78BFA;
    color: #DDD6FE;
  }

  .cta-btn {
    border: none;
    border-radius: 24px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
    color: #fff;
  }
  .cta-btn:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .cta-gold {
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #1a0a00;
    font-weight: 900;
  }
  .cta-purple {
    background: linear-gradient(90deg, var(--purple) 0%, var(--purple-dark) 100%);
  }

  /* ─── COMBO ─── */
  .combo-wrap {
    position: relative;
    border-radius: var(--radius);
    padding: 1.5px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--gold), #FF8C00);
    box-shadow: 0 4px 16px rgba(255,179,0,0.2);
  }

  .combo-inner {
    background: rgba(0,20,40,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: calc(var(--radius) - 1.5px);
    padding: 16px;
    text-align: center;
  }

  .combo-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .combo-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 10px;
  }
  .combo-math {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,179,0,0.35);
    border-radius: 24px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 800;
  }
  .combo-math .arrow { color: var(--gold); font-size: 15px; }
  .combo-math .result { color: var(--gold); font-size: 15px; }

  /* ─── COMMUNITY QUEST ─── */
  .guild-header {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }
  .guild-pool {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 12px;
  }
  .guild-pool span {
    color: var(--gold);
    font-weight: 800;
  }

  .exp-bar-wrap {
    margin-bottom: 8px;
  }
  .exp-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 4px;
  }
  .exp-bar-outer {
    height: 14px;
    border-radius: 10px;
    border: 1.5px solid var(--gold);
    background: rgba(0,0,0,0.3);
    overflow: hidden;
    box-shadow: 0 0 6px rgba(255,179,0,0.2);
  }
  .exp-bar-fill {
    height: 100%;
    width: 67%;
    background: linear-gradient(90deg, #00A86B 0%, #4ADE80 60%, #00A86B 100%);
    background-size: 200% 100%;
    border-radius: 8px;
    animation: shimmerBar 2s linear infinite;
    position: relative;
  }
  .exp-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmerBar 1.5s linear infinite;
    border-radius: inherit;
  }
  @keyframes shimmerBar {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .guild-tagline {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    margin-top: 8px;
  }

  /* ─── ENTRANCE ANIMATIONS (from B's warmth) ─── */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card, .combo-wrap {
    animation: fadeSlideUp 0.35s ease both;
  }
  .card:nth-of-type(1) { animation-delay: 0.05s; }
  .card:nth-of-type(2) { animation-delay: 0.10s; }
  .card:nth-of-type(3) { animation-delay: 0.15s; }
  .card:nth-of-type(4) { animation-delay: 0.20s; }
  .combo-wrap          { animation-delay: 0.18s; }

  /* ─── BOTTOM SAFE AREA ─── */
  .safe-bottom { height: env(safe-area-inset-bottom, 12px); }
</style>
</head>
<body>

<!-- Floating particles -->
<div id="particles" aria-hidden="true">
  <div class="particle">✨</div>
  <div class="particle">⭐</div>
  <div class="particle">💫</div>
</div>

<div class="app">

  <!-- ── TAB BAR ── -->
  <nav class="tab-bar" role="tablist" aria-label="主要導覽">
    <button class="tab active" role="tab" aria-selected="true">
      <span class="tab-icon">⚔️</span>
      <span class="tab-label">離峰大作戰</span>
    </button>
    <button class="tab" role="tab" aria-selected="false">
      <span class="tab-icon">🎁</span>
      <span class="tab-label">盲盒旅行</span>
    </button>
    <button class="tab" role="tab" aria-selected="false">
      <span class="tab-icon">👑</span>
      <span class="tab-label">夢幻特權</span>
    </button>
    <button class="tab" role="tab" aria-selected="false">
      <span class="tab-icon">🗺️</span>
      <span class="tab-label">城市RPG</span>
    </button>
  </nav>

  <!-- ── SCROLL AREA ── -->
  <main class="scroll-area">

    <!-- ── HERO HEADER ── -->
    <header class="hero">
      <div class="hero-title">🚇 捷運冒險家</div>
      <div class="hero-player">
        <div class="avatar-wrap">
          <span class="avatar-emoji">🧑‍💼</span>
          <span class="level-badge">Lv.12 通勤達人</span>
        </div>
        <div class="pts-badge">💰 1,240 pts</div>
      </div>
    </header>

    <!-- ── TODAY'S MISSION BRIEFING ── -->
    <section class="card" aria-label="今日任務簡報">
      <div class="briefing-header">📅 今日任務簡報</div>
      <div class="briefing-line alert-line">
        <span>⚠️</span>
        <span>文湖/板南線 07:30–08:30 爆滿警報</span>
      </div>
      <div class="briefing-line">
        <span>✅</span>
        <span>任務窗口：07:00 前 / 09:00 後</span>
      </div>
    </section>

    <!-- ── MISSION A ── -->
    <section class="card" aria-label="任務A — 卡位承諾">
      <div class="mission-badge badge-gold">⚔️ 任務 A</div>
      <div class="mission-title">卡位承諾</div>
      <div class="mission-sub">承諾離峰進站，解鎖 2× 點數獎勵</div>
      <div class="mission-footer">
        <div class="reward-badge reward-gold">+40 pts / +60 串關</div>
        <button class="cta-btn cta-gold" onclick="handleMissionA()">接受任務 ▶</button>
      </div>
    </section>

    <!-- ── MISSION B ── -->
    <section class="card" aria-label="任務B — 運量猜猜樂">
      <div class="mission-badge badge-purple">🔮 任務 B</div>
      <div class="mission-title">運量猜猜樂</div>
      <div class="mission-sub">精準預測文湖線今日運量</div>
      <div class="mission-footer">
        <div class="reward-badge reward-purple">+30 pts</div>
        <button class="cta-btn cta-purple" onclick="handleMissionB()">開始預測 ▶</button>
      </div>
    </section>

    <!-- ── COMBO ACHIEVEMENT ── -->
    <section class="combo-wrap" aria-label="COMBO 串關獎勵">
      <div class="combo-inner">
        <div class="combo-title">🔥 串關獎勵</div>
        <div class="combo-sub">同時完成兩任務 → 3× 獎勵！</div>
        <div class="combo-math">
          <span>20pt 下注</span>
          <span class="arrow">→</span>
          <span class="result">💰 60pt 回饋</span>
        </div>
      </div>
    </section>

    <!-- ── COMMUNITY QUEST ── -->
    <section class="card" aria-label="社群減碳公會任務">
      <div class="guild-header">🌱 社群減碳公會任務</div>
      <div class="guild-pool">今日基金池：<span>8,420 pts</span></div>
      <div class="exp-bar-wrap">
        <div class="exp-bar-label">
          <span>公會進度</span>
          <span>67%</span>
        </div>
        <div class="exp-bar-outer" role="progressbar" aria-valuenow="67" aria-valuemin="0" aria-valuemax="100" aria-label="公會任務進度">
          <div class="exp-bar-fill"></div>
        </div>
      </div>
      <div class="guild-tagline">全體冒險家一起守護台北！</div>
    </section>

    <div class="safe-bottom"></div>
  </main>
</div>

<script>
  // Tab switching
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected','true');
    });
  });

  // Mission handlers (stub feedback)
  function handleMissionA() {
    const btn = event.currentTarget;
    btn.textContent = '✅ 已接受！';
    btn.style.background = 'linear-gradient(90deg,#4ADE80,#16A34A)';
    btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = '接受任務 ▶'; btn.style.background = ''; btn.style.color = ''; }, 2000);
  }
  function handleMissionB() {
    const btn = event.currentTarget;
    btn.textContent = '⏳ 載入中…';
    setTimeout(() => { btn.textContent = '開始預測 ▶'; }, 1500);
  }
</script>
</body>
</html>
